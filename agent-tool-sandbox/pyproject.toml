[project]
name = "agent-tool-sandbox"
version = "0.1.0"
description = "Agent Tool Sandbox —— 让 Agent 在受控沙箱中执行 Python / Shell / SQL（Policy → Compiler → Sandbox → Runtime → Audit）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
docker = ["docker>=7.0"]     # Docker Sandbox（可选，需 Docker daemon）
postgres = ["asyncpg>=0.29"] # PostgreSQL Execution/Policy/Audit Store（可选，需运行中的 PG）
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
