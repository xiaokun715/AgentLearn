[project]
name = "agent-memory"
version = "0.1.0"
description = "Agent 记忆系统 (Agent Memory System) Demo —— 记忆引擎 8 原语(Insert/SCD2 换代/Delete/Consolidate/Retrieve/Touch/Decay/Wake) + 四层记忆(Working/Short-Term/Episodic/Semantic+Profile) + 后台蒸馏与衰减 Worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
