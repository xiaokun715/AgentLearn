[project]
name = "async-agent-job-queue"
version = "0.1.0"
description = "异步 Agent 任务队列 (Async Agent Job Queue) Demo —— Job / Queue / Worker / State Machine / Checkpoint / Retry / Lease / DLQ / Event Store"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]     # PostgreSQL Job/Checkpoint/Event Store（可选，需 DATABASE_URL + 运行中的 PG）
redis = ["redis>=5.0"]           # Redis Streams 队列（可选，需运行中的 Redis）
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
